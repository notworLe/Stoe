name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: "${{ matrix.service }} — lint & test"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend  # thêm service khác vào đây khi có: frontend, worker...

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Test — pytest
        run: uv run pytest
