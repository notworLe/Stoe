services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://notworle:123123123@database:5432/stoe
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_EMAIL: admin@maisondelua.com.au
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-maison-de-lua-dev-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-hello@maisondelua.com.au}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    depends_on:
      database:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--reload"]

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    depends_on:
      - backend
    command: ["npm", "run", "dev"]

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      POSTGRES_USER: notworle
      POSTGRES_PASSWORD: 123123123
      POSTGRES_DB: stoe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notworle -d stoe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
